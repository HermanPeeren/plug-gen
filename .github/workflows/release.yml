name: Release

# Pushing a tag is the whole release procedure. PhpStorm can create and push a
# tag from the Git menu, so nothing here needs a terminal.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # v5 is the same action on the node24 runtime. v4 declares node20, which
      # GitHub deprecated in September 2025: the runners already fall back to
      # node24 and warn, and this workflow only fires on a release tag, which is
      # the worst moment to be reading warnings.
      - uses: actions/checkout@v5

      # PHP is preinstalled on the runner, but the zip extension the build needs
      # is not guaranteed. Installing it from apt keeps this workflow to a single
      # third-party dependency - the checkout action - which is worth something
      # for a repository whose product is generated code.
      - name: Install PHP with zip
        run: sudo apt-get update -qq && sudo apt-get install -y -qq php-cli php-zip

      - name: The tag must match the manifest
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(php -r 'echo trim((string) simplexml_load_file("src/pluggen.xml")->version);')
          echo "tag: $TAG   manifest: $MANIFEST"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the manifest version $MANIFEST. Bump src/pluggen.xml, or tag the version it already carries."
            exit 1
          fi

      # updates.xml is what an installed site reads to learn a new version
      # exists, and it points at a release asset by name. A stale one either
      # hides this release or offers a download that 404s, and neither shows up
      # in any test. The media asset manifest carries the version too, and a
      # stale one serves a cached stylesheet after an upgrade. Both are written
      # by one script from the manifest, so regenerate and fail on a difference.
      - name: The generated version files must match the manifest
        run: |
          php build/update-xml.php
          if ! git diff --quiet; then
            echo "::error::Generated version files are out of date. Run php build/update-xml.php, commit the result, and re-tag."
            git --no-pager diff
            exit 1
          fi

      # 4.1 gave this repository a dependency: the generation engine is
      # yepr/generator-core now rather than a private copy. So the suite needs
      # composer, which is what retired tests/run.php - a runner written for a
      # machine with none, and there is no longer anything for such a machine to
      # run.
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      # PHPStan resolves the component's base classes against a real Joomla:
      # phpstan.neon scans /joomla, and without it the analysis stops before it
      # starts. /joomla is git-ignored, so CI fetches its own.
      - name: Fetch Joomla
        run: |
          url="https://github.com/joomla/joomla-cms/releases/download/${JOOMLA_VERSION}/Joomla_${JOOMLA_VERSION}-Stable-Full_Package.tar.gz"
          curl -sSL -o joomla.tar.gz "$url"
          mkdir -p joomla
          tar -xzf joomla.tar.gz -C joomla
        env:
          JOOMLA_VERSION: 6.1.4

      - name: Unit tests
        run: composer test

      - name: Static analysis
        run: composer analyse

      - name: Coding standards
        run: composer cs

      # No --no-library. There is no sibling checkout on a runner, so the build
      # fetches the library release script.php insists on - which is the point:
      # what ships is the artefact that was published, and a release needing a
      # library nobody published fails here rather than on somebody's site.
      - name: Build the package
        run: php build/build.php

      # The package is what people install, so its contents are asserted once
      # rather than the build script being trusted forever.
      - name: The package must carry the library and nothing it should not
        run: |
          php -r '
            $zip = new ZipArchive();
            $zip->open(glob("build/com_pluggen-*.zip")[0]);

            $names = [];
            for ($i = 0; $i < $zip->numFiles; $i++) {
                $names[] = $zip->getNameIndex($i);
            }

            // Windows separators unzip on a server as one long filename.
            $bad = array_values(array_filter($names, static fn (string $n): bool =>
                str_contains($n, "node_modules/") || str_contains($n, "\\")));

            if ($bad !== []) {
                fwrite(STDERR, "Package contains files it should not:\n  " . implode("\n  ", $bad) . "\n");
                exit(1);
            }

            // What Joomla needs before it can install anything at all.
            foreach (["pluggen.xml", "script.php"] as $required) {
                if (!in_array($required, $names, true)) {
                    fwrite(STDERR, "Package has no {$required}.\n");
                    exit(1);
                }
            }

            // And the library, without which an installed component fatals on
            // the first screen that generates anything. script.php installs it
            // from exactly here.
            $library = array_filter(
                $names,
                static fn (string $n): bool => str_starts_with($n, "library/") && str_ends_with($n, ".zip")
            );

            if ($library === []) {
                fwrite(STDERR, "Package carries no library. A site installing this could not generate.\n");
                exit(1);
            }

            echo "package holds " . count($names) . " files, none of them unwanted\n";
          '

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/com_pluggen-*.zip \
            --title "Plug-gen $GITHUB_REF_NAME" \
            --generate-notes

      # Joomla checks a downloaded update against the checksum in updates.xml,
      # and warns when there is none. Only this run can write it: the archive
      # was built here, and one built anywhere else differs in timestamps and
      # line endings. updates.xml is served from main, so that is where the
      # checksum is committed - once the release exists, so a site is never told
      # to expect a file that is not there yet.
      - name: Write the checksum into updates.xml on main
        run: |
          git fetch --depth=1 origin main
          git checkout -B main FETCH_HEAD
          MAIN=$(php -r 'echo trim((string) simplexml_load_file("src/pluggen.xml")->version);')
          if [ "v$MAIN" != "$GITHUB_REF_NAME" ]; then
            echo "::warning::main is at $MAIN by now, not $GITHUB_REF_NAME, so the checksum of this release was not written. The download is still installable; Joomla only warns."
            exit 0
          fi
          php build/update-xml.php --checksum
          if git diff --quiet -- updates.xml; then
            echo "updates.xml on main already carries this checksum."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates.xml
          git commit -m "Checksum for the $GITHUB_REF_NAME download"
          git push origin main
